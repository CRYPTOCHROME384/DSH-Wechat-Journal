# 由 `node install.mjs` 自动填写。
# 手动安装时把 dataDir 改成你自己的绝对路径（Windows 用正斜杠或双反斜杠）。
- insert:
    - id: reading-inbox
      name: '@local/reading-inbox'
      config:
        dataDir: ''
        # journalDir: ''   # 省略则用 reading-inbox 同级的 journal/
        chat:
          enabled: true
        llm:
          enabled: true
          # 默认跟随账本定时任务所属会话的模型；无任务时自动选择可用模型。
          # provider: '已在 Harness 配置的 provider id'
          # model: '已在 Harness 配置的 model id'
          # timeoutMs: 45000
          # maxInputBytes: 240000
